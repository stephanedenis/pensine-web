<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback - Pensine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .callback-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    h1 {
      color: #24292e;
      margin-top: 0;
    }

    p {
      color: #586069;
      line-height: 1.6;
    }

    .error {
      color: #d73a49;
      background: #ffdce0;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }

    .success {
      color: #28a745;
      background: #dcffe4;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="callback-container">
    <h1>🔐 Authentification OAuth</h1>
    <div class="spinner" id="spinner"></div>
    <p id="status">Traitement de l'authentification GitHub...</p>
    <div id="message"></div>
  </div>

  <script type="module">
    import GitHubOAuth from '../src/lib/auth/github-oauth.js';

    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');
    const spinnerEl = document.getElementById('spinner');

    function showError(message) {
      spinnerEl.style.display = 'none';
      statusEl.textContent = '❌ Erreur d\'authentification';

      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';

      const strong = document.createElement('strong');
      strong.textContent = 'Erreur : ';
      errorDiv.appendChild(strong);
      errorDiv.appendChild(document.createTextNode(message));

      const br1 = document.createElement('br');
      const br2 = document.createElement('br');
      errorDiv.appendChild(br1);
      errorDiv.appendChild(br2);

      const link = document.createElement('a');
      link.href = '/';
      link.textContent = 'Retour à Pensine';
      errorDiv.appendChild(link);

      messageEl.textContent = '';
      messageEl.appendChild(errorDiv);
    }

    try {
      // Valider le state CSRF et récupérer le code d'autorisation
      // Note : ne jamais logger code ou state — ils permettent d'obtenir un token
      const { code, state } = GitHubOAuth.handleCallback();

      spinnerEl.style.display = 'none';
      statusEl.textContent = '✅ Authentification réussie !';

      const successDiv = document.createElement('div');
      successDiv.className = 'success';
      successDiv.textContent = 'Fermeture de la fenêtre...';
      messageEl.textContent = '';
      messageEl.appendChild(successDiv);

      // Notifier la fenêtre parente via postMessage
      if (window.opener) {
        window.opener.postMessage(
          { type: 'oauth-callback', code, state },
          window.location.origin
        );
        window.close();
      } else {
        // Fallback : redirection directe si pas de popup
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      }

    } catch (error) {
      // Utiliser un message d'erreur sûr (sans données sensibles)
      const safeMessage = error.message || 'Erreur inconnue';
      showError(safeMessage);

      // Notifier la fenêtre parente de l'erreur
      if (window.opener) {
        window.opener.postMessage(
          { type: 'oauth-callback', error: safeMessage },
          window.location.origin
        );
      }
    }
  </script>
</body>

</html>
