name: Smoke tests post-déploiement

on:
  # Se déclenche après chaque déploiement GitHub Pages
  deployment_status:

  # Peut aussi être triggeré manuellement
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL à tester (par défaut https://pensine.org)"
        required: false
        default: "https://pensine.org"

jobs:
  smoke-test:
    # Uniquement si le déploiement est réussi (évite les runs sur les déploiements échoués)
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: |
          # npm ci est strict (lockfile doit être en sync). Si désynchronisé,
          # fallback sur npm install pour ne pas bloquer les smoke tests.
          npm ci || (echo "⚠️ lock file désynchronisé, fallback sur npm install" && npm install)

      - name: Installer Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Déterminer l'URL cible
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            # environment_url = URL du site déployé (ex: https://pensine.org)
            # target_url = URL du job CI (à ne pas utiliser pour les tests)
            ENV_URL="${{ github.event.deployment_status.environment_url }}"
            FALLBACK="https://pensine.org"
            echo "url=${ENV_URL:-$FALLBACK}" >> $GITHUB_OUTPUT
          fi

      - name: Attendre la propagation du déploiement
        run: |
          echo "Test contre : ${{ steps.target.outputs.url }}"
          # Attendre que les fichiers soient bien servis (CDN / cache GitHub Pages)
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.url }}")
            echo "Tentative $i : HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then break; fi
            sleep 10
          done

      - name: Lancer les smoke tests
        run: |
          BASE_URL="${{ steps.target.outputs.url }}" \
          npx playwright test tests/smoke.spec.mjs \
            --project=chromium-ci \
            --reporter=list
        env:
          CI: true

      - name: Uploader le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Créer une issue et assigner à Copilot si échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const targetUrl = '${{ steps.target.outputs.url }}' || 'https://pensine.org';
            const sha = context.sha.substring(0, 7);

            // Éviter les doublons : chercher une issue ouverte récente avec le même titre-clé
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'smoke-test-failure',
              state: 'open',
              per_page: 5,
            });

            if (openIssues.length > 0) {
              // Ajouter un commentaire sur l'issue existante plutôt que d'en créer une nouvelle
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body: `🔁 Nouvel échec sur le commit \`${sha}\` — [Run ${context.runId}](${runUrl})`,
              });
              console.log(`Commentaire ajouté sur l'issue #${openIssues[0].number}`);
              return;
            }

            // Créer une nouvelle issue — mention @copilot dans le body pour déclencher l'agent
            // (assignees: ['copilot'] est invalide via l'API REST)
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Smoke tests échoués sur ${targetUrl} (${sha})`,
              labels: ['bug', 'smoke-test-failure'],
              body: [
                '## Smoke tests échoués après déploiement',
                '',
                `**URL testée :** ${targetUrl}`,
                `**Commit :** \`${sha}\``,
                `**Run CI :** [${context.runId}](${runUrl})`,
                '',
                '## Contexte',
                '',
                'Les smoke tests Playwright (`tests/smoke.spec.mjs`) ont échoué après le dernier déploiement GitHub Pages.',
                'Le rapport complet est disponible en artifact sur le run CI ci-dessus.',
                '',
                '## Actions attendues',
                '',
                '1. Analyser les logs du run CI pour identifier le test en échec',
                '2. Reproduire localement : `BASE_URL=' + targetUrl + ' npm run test:smoke`',
                '3. Corriger le code ou le test selon la cause racine',
                '4. Vérifier que `npm run validate` passe',
                '5. Ouvrir une PR avec le fix',
                '',
                '---',
                '@copilot merci de corriger ce problème.',
              ].join('\n'),
            });

            console.log(`Issue créée : #${issue.data.number} — ${issue.data.html_url}`);
