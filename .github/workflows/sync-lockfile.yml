name: Sync package-lock.json

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token avec droits d'écriture pour le commit automatique
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier la synchronisation
        id: check
        run: |
          # Tenter npm ci ; s'il échoue c'est que le lock file est désynchronisé
          if npm ci --dry-run 2>&1 | grep -q "EUSAGE\|Missing:"; then
            echo "out_of_sync=true" >> $GITHUB_OUTPUT
            echo "⚠️ package-lock.json désynchronisé, correction automatique..."
          else
            echo "out_of_sync=false" >> $GITHUB_OUTPUT
            echo "✅ package-lock.json à jour"
          fi

      - name: Régénérer package-lock.json
        if: steps.check.outputs.out_of_sync == 'true'
        run: npm install

      - name: Commit du lock file corrigé
        if: steps.check.outputs.out_of_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(ci): sync automatique package-lock.json [skip ci]"
          git push
